apiVersion: apps/v1
kind: Deployment
metadata:
  name: minterjt-lab37-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minterjt-lab37-dev
  template:
    metadata:
      labels:
        app: minterjt-lab37-dev
    spec:
      containers:
      - name: nginx
        image: cithit/minterjt:latest
        ports:
        - containerPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minterjt-lab37-dev-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - http:
      paths:
      - path: /lab3-7(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: minterjt-lab37-dev-service
            port:
              number: 80
---
apiVersion: v1
kind: Service
metadata:
  name: minterjt-lab37-dev-service
spec:
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  selector:
    app: minterjt-lab37-dev
