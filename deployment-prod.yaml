apiVersion: apps/v1
kind: Deployment
metadata:
  name: minterjt-lab37-prod
spec:
  replicas: 1  # Number of NGINX pods to run
  selector:
    matchLabels:
      app: minterjt-lab37-prod
  template:
    metadata:
      labels:
        app: minterjt-lab37-prod
    spec:
      containers:
      - name: nginx
        image: cithit/minterjt:latest                             #<----change this!
        ports:
        - containerPort: 80  # Expose NGINX on port 80
---
apiVersion: v1
kind: Service
metadata:
  name: minterjt-lab37-prod-service
  annotations:
    metallb.universe.tf/address-pool: minterjt-production
    metallb.universe.tf/allow-shared-ip: minterjt-labs
spec:
  type: LoadBalancer
  loadBalancerIP: 10.48.229.34                                    # <-----change this!!!!
  ports:
  - protocol: TCP
    port: 8083
    targetPort: 80
  selector:
    app: minterjt-lab37-prod
